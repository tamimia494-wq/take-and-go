databases:
  - name: take-and-go-db
    databaseName: takeandgo
    user: takeandgo
    region: frankfurt
    plan: free

services:
  - type: web
    name: take-and-go-api
    runtime: node
    plan: free
    region: frankfurt
    rootDir: .
    buildCommand: npm ci && npm run build --workspace @take-and-go/api
    startCommand: npm run db:migrate --workspace @take-and-go/api && npm run db:seed --workspace @take-and-go/api && npm run start --workspace @take-and-go/api
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: take-and-go-db
          property: connectionString
      - key: DIRECT_URL
        fromDatabase:
          name: take-and-go-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: GREEN_API_INSTANCE_ID
        sync: false
      - key: GREEN_API_TOKEN
        sync: false
      - key: GREEN_API_GROUP_ID
        sync: false
      - key: GREEN_API_WEBHOOK_TOKEN
        sync: false
      - key: GREEN_API_EXCLUDED_PHONES
        value: ""
      - key: CAPTAIN_APP_URL
        fromService:
          type: web
          name: take-and-go-captain
          envVarKey: RENDER_EXTERNAL_URL
      - key: ADMIN_APP_URL
        fromService:
          type: web
          name: take-and-go-admin
          envVarKey: RENDER_EXTERNAL_URL
      - key: TZ
        value: Asia/Amman

  - type: web
    name: take-and-go-captain
    runtime: node
    plan: free
    region: frankfurt
    rootDir: .
    buildCommand: npm ci && npm run build --workspace @take-and-go/captain
    startCommand: npm run start --workspace @take-and-go/captain
    healthCheckPath: /
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: take-and-go-api
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    name: take-and-go-admin
    runtime: node
    plan: free
    region: frankfurt
    rootDir: .
    buildCommand: npm ci && npm run build --workspace @take-and-go/admin
    startCommand: npm run start --workspace @take-and-go/admin
    healthCheckPath: /
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: take-and-go-api
          envVarKey: RENDER_EXTERNAL_URL
